name: Hermes Box plugin CI

on:
  push:
    # Only on the default branch (i.e. merges). PR branches are covered by
    # `pull_request`, so feature-branch pushes don't run the suite twice.
    branches: [main]
    paths:
      - "packages/hermes-box/**"
      - "packages/python-sdk/**"
      - ".github/workflows/hermes-box-ci.yml"
  pull_request:
    paths:
      - "packages/hermes-box/**"
      - "packages/python-sdk/**"
      - ".github/workflows/hermes-box-ci.yml"

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: hermes-box-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The tests import Hermes core. Pinned so a Hermes change cannot break CI unannounced;
  # bump it deliberately (the plugin needs Hermes >= 0.22.3).
  HERMES_AGENT_REF: 7a82aa6698e98f34c7ed104556403e3cc72ef25b

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_AGENT_REF }}
          path: hermes-agent
      - uses: actions/setup-python@v5
        with:
          # 3.13: on 3.14 Hermes pins Pillow 13, which its browser-harness dependency rejects.
          python-version: "3.13"
      - name: Install
        run: pip install -e ./hermes-agent -e ./packages/python-sdk pytest ruff
      - name: Ruff
        working-directory: packages/hermes-box
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests (integration tests are deselected; they need a key and create real Boxes)
        working-directory: packages/hermes-box
        run: pytest -q
      - name: Hermes plugin validation
        run: hermes plugins validate packages/hermes-box
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
