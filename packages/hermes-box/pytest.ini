[pytest]
testpaths = tests
# Integration tests create real Boxes, billed to the key's account. They are deselected by default,
# even when UPSTASH_BOX_API_KEY is exported; run them with `pytest -m integration`.
addopts = --import-mode=importlib -m "not integration"
markers =
    integration: real Upstash Box API tests; run with `pytest -m integration` (requires UPSTASH_BOX_API_KEY)
