name: upstash-box
label: Upstash Box
kind: backend
version: 0.1.0
author: Upstash
license: MIT
homepage: https://github.com/upstash/box/tree/main/packages/hermes-box
description: >
  Upstash Box terminal backend for Hermes Agent: the terminal, file and code
  tools run inside an Upstash Box cloud container while the agent stays on
  your machine. Select it with `terminal.backend: upstash_box`. With
  `terminal.container_persistent: true` each task's Box is paused on exit and
  resumed by name; with `false` each session gets its own Box, deleted when the
  session ends.
requires_hermes: ">=0.22.3"
requires_env:
  - name: UPSTASH_BOX_API_KEY
    description: "Upstash Box API key (Upstash console, Box section)"
    url: "https://console.upstash.com"
    secret: true
provides_tools: []
provides_hooks: []
